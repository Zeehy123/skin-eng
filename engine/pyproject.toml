[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="skin-engine"
version="0.1.0"
description="Framework-free skincare quiz and recommendation engine"
requires-python=">=3.10"

[tool.setuptools.packages.find]
include=["skin_engine*"]

[tools.pytest.ini_options]
testpaths=["test"]
